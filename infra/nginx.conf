# ──────────────────────────────────────────────────────────
# UrbanBot Nginx Reverse Proxy Configuration
# Routes all traffic to the API service
# Accessible at http://localhost:8080
# ──────────────────────────────────────────────────────────

events { worker_connections 1024; }

http {
  # ── UPSTREAM ────────────────────────────────────────────
  # Points to the API Docker service on port 3000
  upstream api {
    server api:3000;
  }

  server {
    listen 80;

    # ── REST API ──────────────────────────────────────────
    # Proxies all /api/ requests to Fastify
    location /api/ {
      proxy_pass         http://api/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # ── WEBSOCKET ─────────────────────────────────────────
    # Proxies Socket.IO connections for real-time telemetry
    location /socket.io/ {
      proxy_pass         http://api/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }
  }
}