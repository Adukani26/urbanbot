# ──────────────────────────────────────────────────────────
# UrbanBot MQTT Broker Configuration
# Mosquitto broker bridging the robot hardware and the API
# ──────────────────────────────────────────────────────────

# ── MQTT (robot hardware connection) ──────────────────────
listener 1883
allow_anonymous true

# ── WebSockets (browser clients) ──────────────────────────
listener 9001
protocol websockets
allow_anonymous true

# ── PERSISTENCE ───────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
log_dest stdout